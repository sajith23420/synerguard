# Render Blueprint for the SynerGuard API (server/).
# No secrets here. ALLOWED_ORIGINS is declared with sync: false so Render asks
# for its value in the dashboard instead of reading it from this file.
services:
  - type: web
    name: synerguard-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        sync: false
